<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias!</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #25bd64;
            font-size: 2.5rem;
            margin-bottom: 20px;
            line-height: 1;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .cta-button {
            background-color: #25bd64;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .cta-button:hover {
            background-color: #139e4d;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://edunlu-editorial.github.io/catalogo-web/logos/edunlu-original.svg" style="width: 50px;">
        <h1>¡Gracias por sumarte a nuestra comunidad!</h1>
        <p>Pronto recibirás novedades✨</p>
        <a href="https://www.edunlu.unlu.edu.ar/" class="cta-button">Volver a la página de inicio</a>
    </div>
</body>
</html>
